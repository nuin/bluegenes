name: Java 21 and InterMine 6

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y leiningen
      - run: npm ci
      - run: npm ci --prefix test/browser
      - run: test/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: lein test-backend
      - run: lein cljfmt check
      - run: npm run test:cljs --prefix test/browser
      - name: Alliance tool tests
        run: |
          set -euo pipefail
          for tool in alliance-tools/*/package.json; do
            npm test --prefix "$(dirname "$tool")"
          done

  intermine6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CYPRESS_INSTALL_BINARY: '0'
      TESTMODEL_URL: http://localhost:8080/intermine-demo
      BLUEGENES_URL: http://localhost:5000/bluegenes
      TESTMODEL_PATH: intermine-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nuin/intermine
          ref: 5d246cd54d4b6ab2810dcac8fc91ad9325c7ba94
          path: intermine-core
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y leiningen libpq-dev postgresql-client wait-for-it
      - name: Build disposable InterMine 6 fixture
        working-directory: intermine-core
        run: |
          set -euo pipefail
          ./config/ci/init-solr.sh "$PWD"
          ./config/ci/init.sh "$PWD" "$(command -v python3)" ws none "$TESTMODEL_URL"
      - run: npm ci
      - run: npm ci --prefix test/browser
      - run: test/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: lein build
      - name: Start BlueGenes production profile
        run: |
          mkdir -p tools
          printf '{:tools {}}\n' > tools/tools.edn
          lein intermine6 > bluegenes-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$BLUEGENES_URL/version" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat bluegenes-server.log
          exit 1
      - run: node --test test/integration/intermine6.test.cjs
      - run: npm test --prefix test/browser
      - name: Record both source revisions
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git -C intermine-core rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: intermine6-diagnostics
          path: |
            bluegenes-server.log
            test/browser/test-results
